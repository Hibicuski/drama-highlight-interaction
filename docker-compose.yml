services:
  postgres:
    image: postgres:16
    container_name: drama-highlight-postgres
    environment:
      POSTGRES_DB: drama_highlight
      POSTGRES_USER: drama
      POSTGRES_PASSWORD: drama_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drama -d drama_highlight"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
